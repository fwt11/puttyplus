name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: 构建 · 测试 · 打包（${{ matrix.arch }}）
    # ⚠️ **两种架构都要 CI 跑**：arm64 用 GitHub 官方的 ARM runner
    #    （`ubuntu-24.04-arm`，**公开仓库免费**）。fail-fast 关掉 ——
    #    一边失败别把另一边也取消掉（ARM 慢，先跑完的 amd64 不用等它）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # ⚠️ 用 Debian 13 (trixie) 容器：它带 GTK 4.18.6 / VTE 0.80.1，
    #    正好是 debian/control 里声明的依赖下限（Ubuntu runner 只有 GTK 4.14，
    #    编译期就会被 gtk4-sys 的版本断言挡下）。
    container:
      image: debian:trixie
    steps:
      - name: 装构建依赖
        run: |
          set -eux
          apt-get update
          # ⚠️ 这几个都不能少（少一个就在后面某步炸）：
          #    libudev-dev —— serialport → libudev-sys 要 pkg-config 找
          #      libudev.pc，它既不是 GTK 的依赖也不是 VTE 的依赖；
          #    fontconfig + fonts-* —— 基础镜像里**一个字体都没有**，GTK
          #      没有字体会起不来（而且本项目界面是中文的）；
          #    openssh-client —— 提供 ssh / ssh-keygen，私钥管理器与终端
          #      spawn 的逻辑会按 PATH 里有没有它们分叉；
          #    libgl1-mesa-dri —— GSK 的软件渲染后备，headless 下要它；
          #    xauth —— **Debian 的 xvfb 包不依赖它**，而 xvfb-run 找不到
          #      xauth 就直接 exit 3（"xauth command not found"）。
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config \
            libgtk-4-dev libvte-2.91-gtk4-dev \
            libudev-dev \
            openssh-client \
            fontconfig fonts-dejavu-core fonts-noto-cjk \
            libgl1-mesa-dri \
            xvfb xauth debhelper dpkg-dev fakeroot \
            python3

      - uses: actions/checkout@v4

      - name: 版本号一致性校验（Cargo.toml ⟷ debian/changelog）
        # ⚠️ **发版翻车过一次**：v0.2.0 的 tag 打出去时，Cargo.toml 与
        #    debian/changelog 还停在 0.1.0 ⇒ 那个 Release 里的 deb 叫
        #    puttyplus_0.1.0-1_amd64.deb，和 v0.1.0 的**同名**。
        #    ⇒ 在这儿就拦住：版本号对不上，后面的构建与打包都别做。
        run: |
          set -euo pipefail
          python3 tools/check_version.py


      - name: 装 Rust（stable）
        # ⚠️ 装到**固定路径** /opt/rust：容器 job 里 HOME 不是 /root
        #    （runner 会设成 /github/home），硬编码 $HOME/.cargo 会找不到。
        run: |
          set -eux
          export RUSTUP_HOME=/opt/rust/rustup
          export CARGO_HOME=/opt/rust/cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
          echo "RUSTUP_HOME=/opt/rust/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=/opt/rust/cargo" >> "$GITHUB_ENV"
          echo "/opt/rust/cargo/bin" >> "$GITHUB_PATH"

      - name: 缓存 cargo 与 target
        uses: actions/cache@v4
        with:
          path: |
            /opt/rust/cargo/registry
            /opt/rust/cargo/git
            target
          # ⚠️ 键里**必须带架构**：ARM 与 x86 的 target/ 里是不同架构的产物，
          #    共用一个缓存 key 会互相覆盖（偶尔会编出跑不起来的二进制）。
          # ⚠️ **键尾的 v2 是 2026-11 加的**：上一轮 run 编译到一半被取消时，
          #    "Post 缓存"照样把**半成品 target/** 存进了缓存 ⇒ 下一轮恢复它
          #    之后跑的是坏掉的测试二进制 ⇒ 整个测试进程 abort（失败名单是空的，
          #    看着像"玄学"）。换键 ⇒ 旧的那份污染缓存自然作废。
          key: cargo-${{ runner.os }}-${{ matrix.arch }}-v2-${{ hashFiles('Cargo.lock') }}

      - name: 打印工具链与依赖版本
        # 只是给人看的诊断，不让它把整个 CI 拖红（真缺库编译那步会自己报错）
        run: |
          rustc --version || echo "!! 没有 rustc"
          cargo --version || echo "!! 没有 cargo"
          pkg-config --modversion gtk4 || echo "!! 找不到 gtk4.pc"
          pkg-config --modversion vte-2.91-gtk4 || echo "!! 找不到 vte-2.91-gtk4.pc"
          echo "HOME=$HOME"
          echo "PATH=$PATH"

      - name: 编译（release）
        run: cargo build --release --locked

      - name: 摘掉弱符号的 glibc 版本要求
        # ⚠️ Rust 的 std 弱引用了 pidfd_spawnp / pidfd_getpid（glibc 2.39 才有）。
        #    在 trixie（glibc 2.41）上链接 ⇒ 这些弱引用被打了 GLIBC_2.39 标签 ⇒
        #    ① dpkg-shlibdeps 把依赖算成 libc6 (>= 2.39) ⇒ **glibc 2.38 的机器
        #    （Deepin 25 等）装不上**；② 动态加载器直接报
        #    "version `GLIBC_2.39' not found"，程序在老 glibc 上根本起不来。
        #    摘掉标签后依赖回到 libc6 (>= 2.34)。这个步骤对已经在老 glibc 上
        #    编出来的二进制是空操作。
        #
        # ⚠️ 脚本会**自检**（链长 / 符号索引 / 硬下限三条），不过就 exit 1；
        #    --selftest 是脚本自身的单测（摘链首 / 链中 / 链尾三种位置，
        #    2026-11 的 ARM 事故就是"摘链尾那条"摘错了留下的坑）。
        run: |
          set -euo pipefail
          python3 tools/strip_weak_glibc_versions.py --selftest
          python3 tools/strip_weak_glibc_versions.py target/release/puttyplus
          python3 tools/strip_weak_glibc_versions.py --check target/release/puttyplus

      - name: 单元测试
        # ⚠️ **不要给单测提供显示环境**！libtest 把每个测试跑在子线程上，
        #    GTK 要求在主线程初始化：容器里若有 DISPLAY，gtk::init() 会真
        #    的成功 ⇒ 那几个 GTK 用例（theme/menu/density…）就会在子线程里
        #    操作 GTK ⇒ 命中 GTK 的致命断言 ⇒ **整个测试进程 abort**
        #    （失败段都是空的，只有 "test failed"）。不给 DISPLAY 时
        #    gtk::init() 返回 Err ⇒ 那几个用例按设计跳过 ⇒ 与本机一致。
        #    GUI 的断言放在下面的「GUI 冒烟」步骤里（example 跑在主线程）。
        #
        # ⚠️ 失败时把失败名单打成 Actions 注解（网页上直接能看见，也能用
        #    check-runs API 读 —— run 级日志下载要 admin，拿不到）。
        run: |
          set -o pipefail
          cargo test --lib --locked 2>&1 | tee /tmp/test.log || {
            # ⚠️ **注解必须是"一整行"**：`::error::` 的消息到行尾为止，
            #    后面再 echo 出来的东西**不会**进注解（2026-11 踩过：失败名单
            #    一直是空的，只看得到一句"失败名单："）。⇒ 用 printf 把内容
            #    拼进同一个 echo 里；换行写成 %0A，% 本身要先转义成 %25。
            names="$(sed -n '/^failures:$/,/^test result:/p' /tmp/test.log \
              | head -c 3000 | sed 's/%/%25/g' | tr '\n' '%0A')"
            if [ -n "$names" ]; then
              printf '::error::单元测试失败。失败名单：%s\n' "$names"
            else
              # ⚠️ 没有 failures: 段 ⇒ 不是断言失败，而是**整个测试进程 abort**
              #    （GTK 断言 / 段错误 / 坏掉的二进制）⇒ 把日志尾巴也塞进注解，
              #    否则网页上什么都看不到（run 级日志要 admin 才能下载）。
              printf '::error::单元测试失败，且日志里没有 failures: 段（测试进程多半是 abort 了）。日志尾部：%s\n' \
                "$(tail -c 3000 /tmp/test.log | sed 's/%/%25/g' | tr '\n' '%0A')"
            fi
            printf '::error::测试结果行：%s\n' \
              "$(grep -E '^test result:' /tmp/test.log | sed 's/%/%25/g' | tr '\n' '%0A')"
            exit 1
          }

      - name: GUI 冒烟（example 跑在主线程）
        # ⚠️ GTK 的断言只能在这儿测：example 是独立进程 ⇒ gtk::init() 在
        #    主线程里能成功 ⇒ UI 断言真的会跑（单测里那几个会按设计跳过）。
        # ⚠️ 失败时把输出尾部做成注解（run 级日志下载要 admin，拿不到）。
        run: |
          set -uo pipefail
          # ⚠️ HOME 与 ini 全指到临时目录：example 会往 ini 里写东西
          export HOME=/tmp/pp-ci-home
          mkdir -p "$HOME"
          export PUTTYPLUS_SETTINGS_INI="$HOME/settings.ini"
          export PUTTYPLUS_DB_INI="$HOME/databases.ini"
          export PUTTYPLUS_CONN_INI="$HOME/connections.ini"
          export PUTTYPLUS_HIST_INI="$HOME/history.ini"
          export PUTTYPLUS_COLS_INI="$HOME/columns.ini"
          export PUTTYPLUS_RECENT_INI="$HOME/recent.ini"
          export PUTTYPLUS_VAULT="$HOME/credentials.vault"
          rc=0
          for ex in db_ui_smoke db_empty_smoke tree_panel_smoke fileedit_panel_smoke selfheal_smoke; do
            echo "::group::$ex"
            if timeout 180 xvfb-run -a cargo run --release --example "$ex" --locked \
                 > "/tmp/$ex.log" 2>&1; then
              echo "$ex: OK"
            else
              code=$?
              echo "$ex: 失败（退出码 $code）"
              # ⚠️ 注解是单行文本：日志里有 ANSI/控制字符会**把整条注解吃掉**，
              #    整条太长也会被丢弃 ⇒ 先 gzip 再 base64，并**分段**发。
              gzip -c "/tmp/$ex.log" > "/tmp/$ex.gz" 2>/dev/null || true
              rm -f "/tmp/$ex.part."*
              split -b 800 -d "/tmp/$ex.gz" "/tmp/$ex.part." 2>/dev/null || true
              for f in /tmp/$ex.part.*; do
                [ -f "$f" ] || continue
                echo "::error::$ex gz日志片段 $(basename "$f" | sed 's/.*\.//') = $(base64 -w 0 "$f")"
              done
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: 命令行契约回归（73 条黄金基准）
        # ⚠️ **HOME 必须是 /home/<当前用户名>**：脚本里 `-i ~/.ssh/id_rsa` 的
        #    `~` 是**eval 所在的那个 shell** 展开的（既不是 HOME 环境变量，
        #    也不是程序自己展开）⇒ 输出的 keyfile 路径长成 $HOME/.ssh/...。
        #    黄金基准是在 /home/<用户> 下生成的 ⇒ HOME 不是 /home/<用户> 时
        #    路径形状对不上，73 条全 DIFF。
        run: |
          me="$(id -un)"
          mkdir -p "/home/$me"
          export HOME="/home/$me"
          bash tools/cli_contract_check.sh

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: puttyplus-linux-${{ matrix.arch }}
          path: target/release/puttyplus
          if-no-files-found: error

      - name: 打包 deb
        run: |
          set -eux
          bash tools/build_deb.sh
          # dpkg-buildpackage 把产物写在**仓库目录的上一级**，搬进工作区再上传
          cp ../puttyplus_*.deb "$GITHUB_WORKSPACE/"

      - name: 核对 deb 的文件名跟版本号一致
        # ⚠️ deb 的**包名与包版本来自 debian/changelog**，不是 Cargo.toml。
        #    两边对不上就会出现「v0.2.0 的 Release 里装着 0.1.0 的包」
        #    （用户装上后 dpkg -l 显示的还是旧版本）。
        #    ⇒ 这里直接看产出的文件名，名字里必须带当前版本号。
        run: |
          set -euo pipefail
          ver="$(python3 tools/check_version.py --print)"
          echo "当前版本：$ver"
          ls -1 puttyplus_*.deb
          if ! ls -1 puttyplus_*.deb | grep -q "^puttyplus_${ver}-"; then
            echo "::error::deb 的文件名跟版本号 ${ver} 对不上（见上面列出的文件）"
            exit 1
          fi

      - name: 收集诊断（glibc 版本要求）
        # ⚠ 这个步骤**永远成功**：诊断不该把 CI 拖红。产物上传上去，
        #    出问题时直接下载看，不用翻日志（run 级日志要 admin 才能下）。
        run: |
          {
            echo "=== dpkg --print-architecture ==="
            dpkg --print-architecture
            echo "=== deb Depends ==="
            dpkg-deb -f puttyplus_*.deb Depends || true
            echo "=== objdump -p：Version References（谁要的高版本）==="
            objdump -p target/release/puttyplus 2>/dev/null \
              | sed -n '/Version References/,/^$/p' | head -150 || true
            echo "=== readelf --version-info 摘要 ==="
            readelf --version-info target/release/puttyplus 2>/dev/null \
              | grep -oE "GLIBC_[0-9]+\.[0-9]+" | sort -u | tr '\n' ' ' || true
            echo
            echo "=== 版本需求表体检（strip_weak_glibc_versions.py --check）==="
            python3 tools/strip_weak_glibc_versions.py --check target/release/puttyplus 2>&1 || true
          } > "diag-${{ matrix.arch }}.txt" 2>&1
          cat "diag-${{ matrix.arch }}.txt"

      - name: 上传诊断
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.arch }}
          path: diag-${{ matrix.arch }}.txt
          if-no-files-found: warn

      - name: 核对 deb 的依赖（别再出现 libc6 (>= 2.39)）
        # 装不上老系统的根因就是这一行依赖；把它钉在 CI 里，别再回归。
        run: |
          set -o pipefail
          dep="$(dpkg-deb -f puttyplus_*.deb Depends)"
          echo "$dep"
          if echo "$dep" | grep -qE 'libc6 \(>= 2\.(3[5-9]|[4-9][0-9])'; then
            echo "::error::deb 的 libc 依赖过高，老系统装不上：$dep"
            exit 1
          fi

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: puttyplus-deb-${{ matrix.arch }}
          path: puttyplus_*.deb
          if-no-files-found: error
