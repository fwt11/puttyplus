name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: 构建 · 测试 · 打包
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ⚠️ 用 Debian 13 (trixie) 容器：它带 GTK 4.18.6 / VTE 0.80.1，
    #    正好是 debian/control 里声明的依赖下限（Ubuntu runner 只有 GTK 4.14，
    #    编译期就会被 gtk4-sys 的版本断言挡下）。
    container:
      image: debian:trixie
    steps:
      - name: 装构建依赖
        run: |
          set -eux
          apt-get update
          # ⚠️ 这几个都不能少（少一个就在后面某步炸）：
          #    libudev-dev —— serialport → libudev-sys 要 pkg-config 找
          #      libudev.pc，它既不是 GTK 的依赖也不是 VTE 的依赖；
          #    fontconfig + fonts-* —— 基础镜像里**一个字体都没有**，GTK
          #      没有字体会起不来（而且本项目界面是中文的）；
          #    openssh-client —— 提供 ssh / ssh-keygen，私钥管理器与终端
          #      spawn 的逻辑会按 PATH 里有没有它们分叉；
          #    libgl1-mesa-dri —— GSK 的软件渲染后备，headless 下要它。
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config \
            libgtk-4-dev libvte-2.91-gtk4-dev \
            libudev-dev \
            openssh-client \
            fontconfig fonts-dejavu-core fonts-noto-cjk \
            libgl1-mesa-dri \
            xvfb debhelper dpkg-dev fakeroot

      - uses: actions/checkout@v4

      - name: 装 Rust（stable）
        # ⚠️ 装到**固定路径** /opt/rust：容器 job 里 HOME 不是 /root
        #    （runner 会设成 /github/home），硬编码 $HOME/.cargo 会找不到。
        run: |
          set -eux
          export RUSTUP_HOME=/opt/rust/rustup
          export CARGO_HOME=/opt/rust/cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
          echo "RUSTUP_HOME=/opt/rust/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=/opt/rust/cargo" >> "$GITHUB_ENV"
          echo "/opt/rust/cargo/bin" >> "$GITHUB_PATH"

      - name: 缓存 cargo 与 target
        uses: actions/cache@v4
        with:
          path: |
            /opt/rust/cargo/registry
            /opt/rust/cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: 打印工具链与依赖版本
        # 只是给人看的诊断，不让它把整个 CI 拖红（真缺库编译那步会自己报错）
        run: |
          rustc --version || echo "!! 没有 rustc"
          cargo --version || echo "!! 没有 cargo"
          pkg-config --modversion gtk4 || echo "!! 找不到 gtk4.pc"
          pkg-config --modversion vte-2.91-gtk4 || echo "!! 找不到 vte-2.91-gtk4.pc"
          echo "HOME=$HOME"
          echo "PATH=$PATH"

      - name: 编译（release）
        run: cargo build --release --locked

      - name: 单元测试
        # ⚠️ **不要给单测提供显示环境**！libtest 把每个测试跑在子线程上，
        #    GTK 要求在主线程初始化：容器里若有 DISPLAY，gtk::init() 会真
        #    的成功 ⇒ 那几个 GTK 用例（theme/menu/density…）就会在子线程里
        #    操作 GTK ⇒ 命中 GTK 的致命断言 ⇒ **整个测试进程 abort**
        #    （失败段都是空的，只有 "test failed"）。不给 DISPLAY 时
        #    gtk::init() 返回 Err ⇒ 那几个用例按设计跳过 ⇒ 与本机一致。
        #    GUI 的断言放在下面的「GUI 冒烟」步骤里（example 跑在主线程）。
        #
        # ⚠️ 失败时把失败名单打成 Actions 注解（网页上直接能看见，也能用
        #    check-runs API 读 —— run 级日志下载要 admin，拿不到）。
        run: |
          set -o pipefail
          cargo test --lib --locked 2>&1 | tee /tmp/test.log || {
            # 注解是单行的：换行写成 %0A，% 本身要先转义成 %25
            echo "::error::单元测试失败，详见本步骤输出。失败名单："
            sed -n '/^failures:$/,/^test result:/p' /tmp/test.log \
              | head -c 4000 | sed 's/%/%25/g' | tr '\n' '%0A'
            echo
            grep -E "^test result:" /tmp/test.log | sed 's/%/%25/g'
            exit 1
          }

      - name: GUI 冒烟（example 跑在主线程）
        # ⚠️ GTK 的断言只能在这儿测：example 是独立进程 ⇒ gtk::init() 在
        #    主线程里能成功 ⇒ UI 断言真的会跑（单测里那几个会按设计跳过）。
        # ⚠️ 失败时把输出尾部做成注解（run 级日志下载要 admin，拿不到）。
        run: |
          set -o pipefail
          for ex in db_ui_smoke db_empty_smoke tree_panel_smoke; do
            echo "::group::$ex"
            timeout 180 xvfb-run -a cargo run --release --example "$ex" --locked \
              2>&1 | tee "/tmp/$ex.log" || {
                echo "::endgroup::"
                {
                  echo "::error::$ex 失败，输出尾部："
                  tail -c 3000 "/tmp/$ex.log" | sed 's/%/%25/g' | tr '\n' '%0A'
                }
                exit 1
              }
            echo "::endgroup::"
          done

      - name: 命令行契约回归（73 条黄金基准）
        run: bash tools/cli_contract_check.sh

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: puttyplus-linux-x86_64
          path: target/release/puttyplus
          if-no-files-found: error

      - name: 打包 deb
        run: |
          set -eux
          bash tools/build_deb.sh
          # dpkg-buildpackage 把产物写在**仓库目录的上一级**，搬进工作区再上传
          cp ../puttyplus_*.deb "$GITHUB_WORKSPACE/"

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: puttyplus-deb-amd64
          path: puttyplus_*.deb
          if-no-files-found: error
