name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例：v0.1.0）'
        required: true

permissions:
  contents: write   # 要建 Release、上传资产

jobs:
  # ---- 两个架构各编一份（amd64 / arm64）----
  build:
    name: 构建 ${{ matrix.arch }}
    # ⚠️ **两种架构都要出包**：arm64 用 GitHub 官方的 ARM runner
    #    （`ubuntu-24.04-arm`，公开仓库免费）。fail-fast 关掉 ——
    #    一边失败别把另一边也取消掉。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            tarname: puttyplus-linux-x86_64.tar.gz
          - arch: arm64
            runner: ubuntu-24.04-arm
            tarname: puttyplus-linux-aarch64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: debian:trixie
    steps:
      - name: 装构建依赖
        # ⚠️ 见 ci.yml 的注释：libudev-dev / 字体 / openssh-client / xauth 都不能少
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config \
            libgtk-4-dev libvte-2.91-gtk4-dev \
            libudev-dev \
            openssh-client \
            fontconfig fonts-dejavu-core fonts-noto-cjk \
            libgl1-mesa-dri \
            xvfb xauth debhelper dpkg-dev fakeroot \
            xz-utils \
            python3 \
            jq

      - uses: actions/checkout@v4

      - name: 版本号一致性校验（Cargo.toml ⟷ debian/changelog）
        # ⚠️ **早失败**：版本号对不上就别编了（省下二十分钟）。
        #    publish job 里还有一道带 tag 的校验（那边才是"发不发"的闸门）。
        run: |
          set -euo pipefail
          python3 tools/check_version.py

      - name: 装 Rust（stable）
        run: |
          set -eux
          export RUSTUP_HOME=/opt/rust/rustup
          export CARGO_HOME=/opt/rust/cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
          echo "RUSTUP_HOME=/opt/rust/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=/opt/rust/cargo" >> "$GITHUB_ENV"
          echo "/opt/rust/cargo/bin" >> "$GITHUB_PATH"

      - name: 缓存 cargo 与 target
        uses: actions/cache@v4
        with:
          path: |
            /opt/rust/cargo/registry
            /opt/rust/cargo/git
            target
          # ⚠️ 键尾的 v2：见 ci.yml 里的说明（被取消的 run 会把半成品 target/
          #    存进缓存，下一轮恢复后跑的是坏掉的二进制）。
          key: cargo-${{ runner.os }}-${{ matrix.arch }}-v2-${{ hashFiles('Cargo.lock') }}

      - name: 装 Zig 0.17（编译 libghostty-vt 要用）
        # ⚠️ **这段是从 ci.yml 抄来的，修的就是「Release 发不出来」那件事**
        #    （用户 2026-11-12：「今天早上的就没成功」）。
        #    **根因**：`ghostty` 现在是**默认特性**（阶段 4）⇒ Linux 从源码
        #    构建也要 Zig 0.17.x ⇒ 而 release.yml **只**装了 Rust、**没装
        #    Zig** ⇒ 「编译（release）」这一步必然失败 ⇒ publish job 被跳过
        #    ⇒ **Release 根本没建出来**（v0.5.3 / v0.5.4 两次都是这样空的）。
        #    ⚠️ `ci.yml` 早就有这一步 ⇒ CI 全绿、Release 全红，很难联想到。
        # ⚠️ **官方 tarball 的文件名格式**是 `zig-<arch>-linux-<ver>.tar.xz`
        #    —— 也就是 `zig-x86_64-linux-0.17.1.tar.xz`，**不是**
        #    `zig-linux-x86_64-0.17.1.tar.xz`（不少旧教程写的是后者 ⇒ 404）。
        #    固定版本 + 校验 sha256 ⇒ 每轮拿到的 Zig 一模一样，可复现。
        run: |
          set -eux
          ver=0.17.1
          case "${{ matrix.arch }}" in
            amd64)
              arch=x86_64
              sha=3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
              ;;
            arm64)
              arch=aarch64
              sha=a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
              ;;
            *) echo "未知架构 ${{ matrix.arch }}"; exit 1 ;;
          esac
          url="https://ziglang.org/download/$ver/zig-$arch-linux-$ver.tar.xz"
          curl -fsSL --retry 3 --retry-delay 5 "$url" -o /tmp/zig.tar.xz
          echo "$sha  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "ZIG=/opt/zig/zig" >> "$GITHUB_ENV"
          /opt/zig/zig version

      - name: 备好 Ghostty 源码（绕开 build.rs 自己的下载）
        # ⚠️ **同上，这段也是从 ci.yml 抄的**（少了它 build.rs 会自己去
        #    tip.files.ghostty.org 下载源码 ⇒ 网络抖一下整个编译就挂）。
        # ⚠️ 兜底：官方 tarball 拿不到时改从 GitHub codeload 取同一个
        #    commit 的整棵源码树（这条路不校验内容，只要有 build.zig 就行）。
        run: |
          set -eux
          commit=83fb95624b0439ee660c2679b43b38c8b63769cd
          sha=ed57ae9b95581c88f2614e976c1d3f146c02d443a3c26139200eb9de6e645eb4
          url="https://tip.files.ghostty.org/$commit/libghostty-vt-source.tar.gz"
          mkdir -p /opt/ghostty
          if curl -fsSL --retry 3 --retry-delay 5 "$url" -o /tmp/ghostty.tar.gz \
             && echo "$sha  /tmp/ghostty.tar.gz" | sha256sum -c - ; then
            tar -xzf /tmp/ghostty.tar.gz -C /opt/ghostty --strip-components=1
          else
            echo "::warning::官方 tarball 下载失败 ⇒ 改用 GitHub codeload"
            curl -fsSL --retry 3 \
              "https://codeload.github.com/ghostty-org/ghostty/tar.gz/$commit" \
              -o /tmp/ghostty-gh.tar.gz
            tar -xzf /tmp/ghostty-gh.tar.gz -C /opt/ghostty --strip-components=1
          fi
          if [ ! -f /opt/ghostty/build.zig ]; then
            echo "::error::Ghostty 源码里没有 build.zig（包结构变了？）"
            exit 1
          fi
          echo "GHOSTTY_SOURCE_DIR=/opt/ghostty" >> "$GITHUB_ENV"

      - name: 编译（release）
        run: cargo build --release --locked

      - name: 摘掉弱符号的 glibc 版本要求
        # ⚠️ 见 ci.yml 同名步骤的注释：Rust 的 std 弱引用了 glibc 2.39 才有的
        #    pidfd_* ⇒ 在 trixie 上链接会给它们打 GLIBC_2.39 标签 ⇒ deb 的
        #    依赖被算成 libc6 (>= 2.39) ⇒ glibc 2.38 的机器装不上，
        #    而且动态加载器会直接拒绝启动程序。
        #    脚本会自检（链长 / 符号索引 / 硬下限），不过就 exit 1。
        run: |
          set -euo pipefail
          python3 tools/strip_weak_glibc_versions.py --selftest
          python3 tools/strip_weak_glibc_versions.py target/release/puttyplus
          python3 tools/strip_weak_glibc_versions.py --check target/release/puttyplus

      - name: 命令行契约回归（73 条黄金基准）
        # ⚠️ HOME 必须是 /home/<当前用户名>：`~` 是 eval 所在 shell 展开的，
        #    黄金基准是在 /home/<用户> 下生成的。
        run: |
          me="$(id -un)"
          mkdir -p "/home/$me"
          export HOME="/home/$me"
          bash tools/cli_contract_check.sh

      - name: 打包 deb
        run: |
          set -eux
          bash tools/build_deb.sh
          # dpkg-buildpackage 把产物写在仓库目录的上一级
          cp ../puttyplus_*.deb "$GITHUB_WORKSPACE/"

      - name: 收集诊断（glibc 版本要求）
        # ⚠ 这个步骤**永远成功**：诊断不该把 CI 拖红。产物上传上去，
        #    出问题时直接下载看，不用翻日志（run 级日志要 admin 才能下）。
        run: |
          {
            echo "=== dpkg --print-architecture ==="
            dpkg --print-architecture
            echo "=== deb Depends ==="
            dpkg-deb -f puttyplus_*.deb Depends || true
            echo "=== objdump -p：Version References（谁要的高版本）==="
            objdump -p target/release/puttyplus 2>/dev/null \
              | sed -n '/Version References/,/^$/p' | head -150 || true
            echo "=== readelf --version-info 摘要 ==="
            readelf --version-info target/release/puttyplus 2>/dev/null \
              | grep -oE "GLIBC_[0-9]+\.[0-9]+" | sort -u | tr '\n' ' ' || true
            echo
            echo "=== 版本需求表体检（strip_weak_glibc_versions.py --check）==="
            python3 tools/strip_weak_glibc_versions.py --check target/release/puttyplus 2>&1 || true
          } > "diag-${{ matrix.arch }}.txt" 2>&1
          cat "diag-${{ matrix.arch }}.txt"

      - name: 上传诊断
        uses: actions/upload-artifact@v4
        with:
          name: diag-${{ matrix.arch }}
          path: diag-${{ matrix.arch }}.txt
          if-no-files-found: warn

      - name: 核对 deb 的依赖（别再出现 libc6 (>= 2.39)）
        run: |
          set -o pipefail
          dep="$(dpkg-deb -f puttyplus_*.deb Depends)"
          echo "$dep"
          if echo "$dep" | grep -qE 'libc6 \(>= 2\.(3[5-9]|[4-9][0-9])'; then
            echo "::error::deb 的 libc 依赖过高，老系统装不上：$dep"
            exit 1
          fi

      - name: 收拢二进制
        # ⚠️ **校验和不在这里算**：要覆盖两个架构的全部资产 ⇒ 统一在
        #    publish job 里算（那时 dist/ 里才有两个架构的东西）。
        run: |
          set -eux
          mkdir -p dist/pkg
          cp target/release/puttyplus dist/pkg/puttyplus
          cp README.md LICENSE dist/pkg/
          # ⚠️ deb 在仓库根（dpkg-buildpackage 写在上一级），**得先拷进 dist/**
          #    —— 否则下一步在 dist/ 里找不到它。
          cp puttyplus_*.deb dist/
          tar -C dist/pkg -czf "$GITHUB_WORKSPACE/dist/${{ matrix.tarname }}" \
            puttyplus README.md LICENSE
          ls -l dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/${{ matrix.tarname }}
          if-no-files-found: error

  # ---- Windows 版也编一份，资产一起挂进 Release ----
  #
  # ⚠️ **为什么以前 Release 里没有 Windows 版**：`release.yml` 原来**只有
  #    Linux 的两个架构**（amd64 / arm64）；Windows 版的构建在
  #    `ci-windows.yml` 里，但它只 `upload-artifact` ⇒ 只是 **CI 的构建
  #    产物**（下载页会过期），**不是 Release 资产** ⇒ 用户在 Release 页面
  #    下不到 Windows 版。
  #
  # ⇒ 这里**复用** `ci-windows.yml`（它已经会跑单测 + 73 条契约，顺带当
  #    一道发布前的闸门）⇒ 它的产物 artifact 叫 `pkg-windows` ⇒ 下面
  #    `pattern: pkg-*` 正好收拢得到。
  build_windows:
    name: 构建 Windows 版
    uses: ./.github/workflows/ci-windows.yml

  # ---- 三个架构都编完，再统一建 Release ----
  publish:
    name: 建 Release 并上传资产
    needs: [build, build_windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 收拢各架构的产物
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist

      - name: 版本号一致性校验（tag ⟷ Cargo.toml ⟷ debian/changelog）
        # ⚠️ **这道闸门是 v0.2.0 那次翻车的补丁**：
        #    tag 打的是 v0.2.0，可 Cargo.toml 与 debian/changelog 还停在
        #    0.1.0 ⇒ 产出的 deb 叫 puttyplus_0.1.0-1_amd64.deb（和 v0.1.0
        #    的**同名**），Release 正文也写着「PuTTYPlus 0.1.0」。
        #    三处版本号必须一致，不一致就别发。
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/check_version.py "$TAG"

      - name: 核对资产齐全（两个架构的 deb + tar.gz）
        # ⚠️ deb 的**包名与包版本来自 debian/changelog**，不是 Cargo.toml。
        #    两边对不上就会出现「v0.2.0 的 Release 里装着 0.1.0 的包」。
        #    ⇒ 直接看产出的文件名，名字里必须带当前版本号。
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver="$(python3 tools/check_version.py --print)"
          echo "当前版本：$ver"
          ls -1 dist
          for f in dist/puttyplus_*.deb; do
            [ -f "$f" ] || { echo "::error::没有 deb 产物"; exit 1; }
            base="$(basename "$f")"
            case "$base" in
              puttyplus_"${ver}"-*_amd64.deb|puttyplus_"${ver}"-*_arm64.deb) : ;;
              *) echo "::error::deb 文件名跟版本号 ${ver} 对不上：$base"; exit 1 ;;
            esac
          done
          for t in dist/puttyplus-linux-x86_64.tar.gz dist/puttyplus-linux-aarch64.tar.gz; do
            [ -f "$t" ] || { echo "::error::缺少 $t"; exit 1; }
          done
          # ⚠️ **Windows 的 zip 也要在**：它跟两个 deb 一样是「用户直接
          #    下载就能用」的东西 ⇒ 少它 ⇒ Release 里就没有 Windows 版
          #    （这正是 0.5.0 发布时用户问「为什么没有 windows 版的」）。
          for t in dist/puttyplus-windows-x86_64.zip; do
            [ -f "$t" ] || { echo "::error::缺少 $t"; exit 1; }
          done

      - name: 生成发布说明（版本号从 tag 注入）
        # ⚠️ 正文**不再硬编码**在 workflow 里：按版本放在仓库的
        #    docs/发布说明/<tag>.md，`{{VERSION}}` 会替换成实际版本号。
        #    没有对应文件 ⇒ 直接失败（宁可不发，也不要发一个说错版本的说明）。
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="docs/发布说明/${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::找不到发布说明 $notes（发版说明必须按版本写好再打 tag）"
            exit 1
          fi
          sed "s/{{VERSION}}/${version}/g" "$notes" > "$GITHUB_WORKSPACE/dist/notes.md"
          cat "$GITHUB_WORKSPACE/dist/notes.md"

      - name: 算校验和（覆盖各架构的全部资产）
        run: |
          set -eux
          cd dist
          sha256sum puttyplus_*.deb puttyplus-linux-*.tar.gz puttyplus-windows-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: 建 Release 并上传资产
        # ⚠️ 用 REST API 而不是 gh CLI：容器里 gh 的认证/参数组合容易出岔子，
        #    而 API 的每一步都能看到状态码。失败时把响应体做成注解回传。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE/dist"


          api() {  # api <method> <url> [json-body]
            local method="$1" url="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl -sS -o /tmp/api.out -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/json" \
                -d "$body" "$url"
            else
              curl -sS -o /tmp/api.out -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url"
            fi
          }

          dump() {  # 把 /tmp/api.out 做成注解（gzip+base64 分段，控制字符不会吃掉整条）
            gzip -c /tmp/api.out > /tmp/api.gz 2>/dev/null || true
            rm -f /tmp/api.part.*
            split -b 800 -d /tmp/api.gz /tmp/api.part. 2>/dev/null || true
            for f in /tmp/api.part.*; do
              [ -f "$f" ] || continue
              echo "::error::API 响应片段 $(basename "$f" | sed 's/.*\.//') = $(base64 -w 0 "$f")"
            done
            echo "::error::API 响应原文（前 800 字）：$(head -c 800 /tmp/api.out | sed 's/%/%25/g' | tr '\n' ' ')"
          }

          # 1) tag 必须已经推到远端（否则 API 会拿默认分支的 HEAD 建 tag）
          echo "::group::查 tag"
          code=$(api GET "https://api.github.com/repos/$REPO/git/ref/tags/$TAG")
          echo "tag 状态码：$code"
          if [ "$code" != "200" ]; then
            dump
            echo "::error::tag $TAG 不在远端，先 push 再发版"
            exit 1
          fi
          echo "::endgroup::"

          # 2) 建 Release（已存在就复用它的 id）
          echo "::group::建 Release"
          code=$(api GET "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          if [ "$code" = "200" ]; then
            rid=$(jq -r '.id' /tmp/api.out)
            echo "Release 已存在，id=$rid"
            # ⚠️ **顺手把正文同步一遍**：发布说明改了（比如补上「Windows 版
            #    的 zip」这一行）⇒ 重跑这个 workflow 时，Release 页面上的
            #    正文也跟着更新，不用手工改。
            #    （之前只在**新建** Release 时写正文 ⇒ 已存在的 Release 永远
            #    是第一次发布时的样子。）
            body=$(jq -n --arg tag "$TAG" --arg name "PuTTYPlus $TAG" \
                   --rawfile body notes.md \
                   '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}')
            code=$(api PATCH "https://api.github.com/repos/$REPO/releases/$rid" "$body")
            echo "同步 Release 正文：$code"
            if [ "$code" != "200" ]; then
              dump
              echo "::error::同步 Release 正文失败（$code）"
              exit 1
            fi
          else
            body=$(jq -n --arg tag "$TAG" --arg name "PuTTYPlus $TAG" \
                   --rawfile body notes.md \
                   '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}')
            code=$(api POST "https://api.github.com/repos/$REPO/releases" "$body")
            echo "建 Release 状态码：$code"
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              dump
              exit 1
            fi
            rid=$(jq -r '.id' /tmp/api.out)
          fi
          echo "::endgroup::"

          # 3) 上传资产（同名先删掉，否则 422）
          echo "::group::上传资产"
          upload_url=$(jq -r '.upload_url' /tmp/api.out)
          [ -n "$upload_url" ] && [ "$upload_url" != "null" ] || {
            upload_url="https://uploads.github.com/repos/$REPO/releases/$rid/assets"
          }
          upload_url=$(echo "$upload_url" | sed 's/{[^}]*}//')
          for f in puttyplus_*.deb puttyplus-linux-*.tar.gz puttyplus-windows-*.zip SHA256SUMS; do
            [ -f "$f" ] || continue
            old_id=$(api GET "https://api.github.com/repos/$REPO/releases/$rid/assets" \
                     >/dev/null 2>&1; jq -r --arg n "$f" '.[] | select(.name==$n) | .id' /tmp/api.out 2>/dev/null | head -1)
            if [ -n "$old_id" ] && [ "$old_id" != "null" ]; then
              api DELETE "https://api.github.com/repos/$REPO/releases/assets/$old_id" >/dev/null || true
            fi
            code=$(curl -sS -o /tmp/up.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$upload_url?name=$f")
            echo "上传 $f：$code"
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              gzip -c /tmp/up.out > /tmp/up.gz 2>/dev/null || true
              echo "::error::上传 $f 失败（$code）：$(head -c 500 /tmp/up.out | tr '\n' ' ')"
              exit 1
            fi
          done
          echo "::endgroup::"

          echo "Release 就绪：https://github.com/$REPO/releases/tag/$TAG"
