name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例：v0.1.0）'
        required: true

permissions:
  contents: write   # 要建 Release、上传资产

jobs:
  release:
    name: 打 tag · 构建 · 发 Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: debian:trixie
    steps:
      - name: 装构建依赖
        # ⚠️ 见 ci.yml 的注释：libudev-dev / 字体 / openssh-client / xauth 都不能少
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config \
            libgtk-4-dev libvte-2.91-gtk4-dev \
            libudev-dev \
            openssh-client \
            fontconfig fonts-dejavu-core fonts-noto-cjk \
            libgl1-mesa-dri \
            xvfb xauth debhelper dpkg-dev fakeroot \
            python3 \
            jq

      - uses: actions/checkout@v4

      - name: 装 Rust（stable）
        run: |
          set -eux
          export RUSTUP_HOME=/opt/rust/rustup
          export CARGO_HOME=/opt/rust/cargo
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
          echo "RUSTUP_HOME=/opt/rust/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=/opt/rust/cargo" >> "$GITHUB_ENV"
          echo "/opt/rust/cargo/bin" >> "$GITHUB_PATH"

      - name: 缓存 cargo 与 target
        uses: actions/cache@v4
        with:
          path: |
            /opt/rust/cargo/registry
            /opt/rust/cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: 编译（release）
        run: cargo build --release --locked

      - name: 摘掉弱符号的 glibc 版本要求
        # ⚠️ 见 ci.yml 同名步骤的注释：Rust 的 std 弱引用了 glibc 2.39 才有的
        #    pidfd_* ⇒ 在 trixie 上链接会给它们打 GLIBC_2.39 标签 ⇒ deb 的
        #    依赖被算成 libc6 (>= 2.39) ⇒ glibc 2.38 的机器装不上。
        run: python3 tools/strip_weak_glibc_versions.py target/release/puttyplus

      - name: 命令行契约回归（73 条黄金基准）
        # ⚠️ HOME 必须是 /home/<当前用户名>：`~` 是 eval 所在 shell 展开的，
        #    黄金基准是在 /home/<用户> 下生成的。
        run: |
          me="$(id -un)"
          mkdir -p "/home/$me"
          export HOME="/home/$me"
          bash tools/cli_contract_check.sh

      - name: 打包 deb
        run: |
          set -eux
          bash tools/build_deb.sh
          # dpkg-buildpackage 把产物写在仓库目录的上一级
          cp ../puttyplus_*.deb "$GITHUB_WORKSPACE/"

      - name: 核对 deb 的依赖（别再出现 libc6 (>= 2.39)）
        run: |
          set -o pipefail
          dep="$(dpkg-deb -f puttyplus_*.deb Depends)"
          echo "$dep"
          if echo "$dep" | grep -qE 'libc6 \(>= 2\.(3[5-9]|[4-9][0-9])'; then
            echo "::error::deb 的 libc 依赖过高，老系统装不上：$dep"
            exit 1
          fi

      - name: 收拢二进制并算校验和
        run: |
          set -eux
          mkdir -p dist/pkg
          cp target/release/puttyplus dist/pkg/puttyplus
          cp README.md LICENSE dist/pkg/
          # ⚠️ deb 在仓库根（dpkg-buildpackage 写在上一级），**得先拷进 dist/**
          #    —— 否则下一步在 dist/ 里 sha256sum 找不到它，直接退出 1。
          cp puttyplus_*.deb dist/
          tar -C dist/pkg -czf "$GITHUB_WORKSPACE/dist/puttyplus-linux-x86_64.tar.gz" \
            puttyplus README.md LICENSE
          cd dist
          sha256sum puttyplus_*.deb puttyplus-linux-x86_64.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: 建 Release 并上传资产
        # ⚠️ 用 REST API 而不是 gh CLI：容器里 gh 的认证/参数组合容易出岔子，
        #    而 API 的每一步都能看到状态码。失败时把响应体做成注解回传。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE/dist"

          cat > notes.md <<'EOF'
          ## PuTTYPlus 0.1.0

          PuTTY 兼容的 SSH 终端 + 图形化 SFTP + 数据库工作台（Linux / GTK4）。

          **下载**

          - `puttyplus_0.1.0-1_amd64.deb` —— Debian / Ubuntu 等发行版的安装包
            （依赖 GTK ≥ 4.18、VTE ≥ 0.80）
          - `puttyplus-linux-x86_64.tar.gz` —— 免安装的单个可执行文件
            （SSH 与加密全静态，只要目标机器有 GTK4 / VTE4）

          校验和见 `SHA256SUMS`。

          **特性**：命令行与 PuTTY 兼容（可顶替 PuTTY 部署在堡垒机上）· 终端 + SFTP
          双栏同窗口 · 数据库工作台（PostgreSQL / MySQL，通道复用当前 SSH 连接）·
          凭据库（argon2 + AES-GCM）· 会话录制与回放（asciicast）· 串口会话。

          详见 [README](https://github.com/fwt11/puttyplus#readme)。
          EOF

          api() {  # api <method> <url> [json-body]
            local method="$1" url="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl -sS -o /tmp/api.out -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Content-Type: application/json" \
                -d "$body" "$url"
            else
              curl -sS -o /tmp/api.out -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$url"
            fi
          }

          dump() {  # 把 /tmp/api.out 做成注解（gzip+base64 分段，控制字符不会吃掉整条）
            gzip -c /tmp/api.out > /tmp/api.gz 2>/dev/null || true
            rm -f /tmp/api.part.*
            split -b 800 -d /tmp/api.gz /tmp/api.part. 2>/dev/null || true
            for f in /tmp/api.part.*; do
              [ -f "$f" ] || continue
              echo "::error::API 响应片段 $(basename "$f" | sed 's/.*\.//') = $(base64 -w 0 "$f")"
            done
            echo "::error::API 响应原文（前 800 字）：$(head -c 800 /tmp/api.out | sed 's/%/%25/g' | tr '\n' ' ')"
          }

          # 1) tag 必须已经推到远端（否则 API 会拿默认分支的 HEAD 建 tag）
          echo "::group::查 tag"
          code=$(api GET "https://api.github.com/repos/$REPO/git/ref/tags/$TAG")
          echo "tag 状态码：$code"
          if [ "$code" != "200" ]; then
            dump
            echo "::error::tag $TAG 不在远端，先 push 再发版"
            exit 1
          fi
          echo "::endgroup::"

          # 2) 建 Release（已存在就复用它的 id）
          echo "::group::建 Release"
          code=$(api GET "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          if [ "$code" = "200" ]; then
            rid=$(jq -r '.id' /tmp/api.out)
            echo "Release 已存在，id=$rid"
          else
            body=$(jq -n --arg tag "$TAG" --arg name "PuTTYPlus $TAG" \
                   --rawfile body notes.md \
                   '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}')
            code=$(api POST "https://api.github.com/repos/$REPO/releases" "$body")
            echo "建 Release 状态码：$code"
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              dump
              exit 1
            fi
            rid=$(jq -r '.id' /tmp/api.out)
          fi
          echo "::endgroup::"

          # 3) 上传资产（同名先删掉，否则 422）
          echo "::group::上传资产"
          upload_url=$(jq -r '.upload_url' /tmp/api.out)
          [ -n "$upload_url" ] && [ "$upload_url" != "null" ] || {
            upload_url="https://uploads.github.com/repos/$REPO/releases/$rid/assets"
          }
          upload_url=$(echo "$upload_url" | sed 's/{[^}]*}//')
          for f in puttyplus_*.deb puttyplus-linux-x86_64.tar.gz SHA256SUMS; do
            [ -f "$f" ] || continue
            old_id=$(api GET "https://api.github.com/repos/$REPO/releases/$rid/assets" \
                     >/dev/null 2>&1; jq -r --arg n "$f" '.[] | select(.name==$n) | .id' /tmp/api.out 2>/dev/null | head -1)
            if [ -n "$old_id" ] && [ "$old_id" != "null" ]; then
              api DELETE "https://api.github.com/repos/$REPO/releases/assets/$old_id" >/dev/null || true
            fi
            code=$(curl -sS -o /tmp/up.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$upload_url?name=$f")
            echo "上传 $f：$code"
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              gzip -c /tmp/up.out > /tmp/up.gz 2>/dev/null || true
              echo "::error::上传 $f 失败（$code）：$(head -c 500 /tmp/up.out | tr '\n' ' ')"
              exit 1
            fi
          done
          echo "::endgroup::"

          echo "Release 就绪：https://github.com/$REPO/releases/tag/$TAG"
